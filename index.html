<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Miri Game" />
    <link rel="apple-touch-icon" href="rm.png" />
    <title>Miri's Game Party</title>
    <script src="kaplay.js"></script>
    <style>
      body {
        margin: 0;
        background: #111;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      const k = kaplay({
        background: [255, 255, 255],
        touchToMouse: true,
      });

      // 최고 점수 불러오기 함수
      function getBestScore() {
        return localStorage.getItem("miriBestScore") || 0;
      }

      // 최고 점수 저장 함수
      function setBestScore(score) {
        const best = getBestScore();
        if (score > best) {
          localStorage.setItem("miriBestScore", score);
        }
      }

      // --- [NEW] 메인 메뉴 (게임 선택 화면) ---
      k.scene("lobby", () => {
        k.background = [240, 240, 240];

        k.add([
          k.text("Miri's Game Party", { size: 32 }),
          k.pos(k.center().x, 100),
          k.anchor("center"),
          k.color(50, 50, 50),
        ]);

        function createMenuBtn(label, position, sceneName, btnColor) {
          const btn = k.add([
            k.rect(240, 70, { radius: 12 }),
            k.pos(position),
            k.anchor("center"),
            k.color(btnColor),
            k.area(),
          ]);
          k.add([
            k.text(label, { size: 22 }),
            k.pos(position),
            k.anchor("center"),
            k.color(255, 255, 255),
          ]);
          btn.onClick(() => k.go(sceneName));
        }

        const startY = k.center().y - 40;
        createMenuBtn(
          "🦖 디노",
          k.vec2(k.center().x, startY),
          "dino",
          k.rgb(80, 180, 80),
        );
        createMenuBtn(
          "🚀 우주선",
          k.vec2(k.center().x, startY + 90),
          "shooter",
          k.rgb(80, 80, 220),
        );
        createMenuBtn(
          "🧩 퍼즐",
          k.vec2(k.center().x, startY + 180),
          "match3",
          k.rgb(220, 120, 60),
        );
      });

      // 1. 공룡 게임 (Dino Run)
      k.scene("dino", () => {
        k.setGravity(1600);
        let score = 0;
        const FLOOR_HEIGHT = 48;
        const player = k.add([
          k.text("🦖", { size: 64 }),
          k.pos(80, k.height() - FLOOR_HEIGHT),
          k.area(),
          k.body(),
          k.anchor("bot"),
          k.color(0, 0, 0),
        ]);
        k.add([
          k.rect(k.width(), 2),
          k.pos(0, k.height() - FLOOR_HEIGHT),
          k.area(),
          k.body({ isStatic: true }),
          k.color(0, 0, 0),
        ]);
        const scoreLabel = k.add([
          k.text("Score: 0", { size: 24 }),
          k.pos(k.width() - 150, 24),
          k.color(0, 0, 0),
        ]);
        function jump() {
          if (player.isGrounded()) player.jump(750);
        }
        k.onKeyPress("space", jump);
        k.onMousePress(jump);
        function spawnObstacle() {
          k.add([
            k.text(k.choose(["🌵", "🧱", "🪨"]), { size: 56 }),
            k.area(),
            k.pos(k.width(), k.height() - FLOOR_HEIGHT),
            k.anchor("bot"),
            k.move(k.LEFT, 260),
            k.color(0, 0, 0),
            "obstacle",
            { passed: false },
          ]);
          k.wait(k.rand(1.5, 3), spawnObstacle);
        }
        spawnObstacle();
        k.onUpdate("obstacle", (obj) => {
          if (obj.pos.x < player.pos.x && !obj.passed) {
            score++;
            obj.passed = true;
            scoreLabel.text = "Score: " + score;
          }
        });
        player.onCollide("obstacle", () => {
          k.shake();
          k.go("lose", score);
        });
      });

      // 2. 슈팅 게임 (Shooter)
      k.scene("shooter", () => {
        k.background = [20, 20, 40];
        let score = 0;
        const baseSize = k.width() * 0.12; // 사이즈 약간 더 키움
        const player = k.add([
          k.text("🚀", { size: baseSize }),
          k.pos(k.width() / 2, k.height() - baseSize * 2),
          k.area(),
          k.anchor("center"),
          "player",
        ]);
        const scoreLabel = k.add([
          k.text("Score: 0", { size: baseSize * 0.5 }),
          k.pos(20, 20),
          k.color(255, 255, 255),
        ]);
        k.onUpdate(() => {
          if (k.isMouseDown()) {
            const mPos = k.mousePos();
            player.pos.x = k.lerp(player.pos.x, mPos.x, 0.2);
          }
        });
        k.onMousePress(() => {
          k.add([
            k.rect(baseSize * 0.15, baseSize * 0.5),
            k.pos(player.pos.x, player.pos.y - baseSize),
            k.color(0, 255, 255),
            k.area(),
            k.move(k.UP, 800),
            k.offscreen({ destroy: true }),
            "bullet",
          ]);
        });
        function spawnEnemy() {
          k.add([
            k.text("☄️", { size: baseSize * 0.9 }),
            k.pos(k.rand(baseSize, k.width() - baseSize), -baseSize),
            k.area(),
            k.move(k.DOWN, k.rand(200, 400)),
            k.offscreen({ destroy: true }),
            "enemy",
          ]);
          k.wait(k.rand(0.4, 1.0), spawnEnemy);
        }
        spawnEnemy();
        k.onCollide("bullet", "enemy", (b, e) => {
          k.destroy(b);
          k.destroy(e);
          score += 10;
          scoreLabel.text = `Score: ${score}`;
        });
        player.onCollide("enemy", () => {
          k.shake(10);
          k.go("lose", score);
        });
      });

      // 3. 퍼즐 게임 (Match3)
      k.scene("match3", () => {
        k.background = [250, 240, 230];

        const BOARD_SIZE = 5;
        const minDimension = Math.min(k.width(), k.height());
        const TILE_SIZE = (minDimension * 0.85) / BOARD_SIZE;
        const CONTENT_SIZE = TILE_SIZE * 0.8;
        const TYPES = ["🐨", "🐹", "🐱", "🐥", "🐰"];

        let board = [];
        let isLocked = false;
        let score = 0;
        let timeLeft = 60;
        let gameEnded = false;

        const offsetX =
          k.center().x - (BOARD_SIZE * TILE_SIZE) / 2 + TILE_SIZE / 2;
        const offsetY =
          k.center().y - (BOARD_SIZE * TILE_SIZE) / 2 + TILE_SIZE / 2 + 50;

        // --- 1. 초기 보드 배열 초기화 ---
        for (let x = 0; x < BOARD_SIZE; x++) {
          board[x] = [];
          for (let y = 0; y < BOARD_SIZE; y++) board[x][y] = null;
        }

        // --- 2. 상단 UI ---
        k.add([
          k.text("Puzzle", { size: 24 }),
          k.pos(20, 30),
          k.color(100, 50, 0),
        ]);
        const scoreLabel = k.add([
          k.text("Score: 0", { size: 28 }),
          k.pos(20, 70),
          k.color(255, 100, 0),
        ]);
        const timerLabel = k.add([
          k.text(`Time: 60s`, { size: 28 }),
          k.pos(k.width() - 20, 70),
          k.anchor("right"),
          k.color(255, 0, 0),
        ]);

        k.onUpdate(() => {
          if (!gameEnded) {
            timeLeft -= k.dt();
            if (timeLeft <= 0) {
              gameEnded = true;
              k.go("lose", score);
            }
            timerLabel.text = `Time: ${Math.ceil(timeLeft)}s`;
          }
        });

        // --- 3. 스와이프 조작 ---
        let swipingTile = null;
        let swipeStartPos = null;

        k.onMousePress(() => {
          if (isLocked || gameEnded) return;
          swipeStartPos = k.mousePos();
          for (let t of k.get("tile")) {
            if (
              Math.abs(t.pos.x - swipeStartPos.x) < TILE_SIZE / 2 &&
              Math.abs(t.pos.y - swipeStartPos.y) < TILE_SIZE / 2
            ) {
              swipingTile = t;
              break;
            }
          }
        });

        k.onMouseRelease(() => {
          if (!swipingTile || isLocked || gameEnded) return;
          let mPos = k.mousePos();
          let dx = mPos.x - swipeStartPos.x,
            dy = mPos.y - swipeStartPos.y;

          if (Math.abs(dx) > TILE_SIZE / 4 || Math.abs(dy) > TILE_SIZE / 4) {
            let tx = swipingTile.gridX,
              ty = swipingTile.gridY;
            if (Math.abs(dx) > Math.abs(dy)) tx += dx > 0 ? 1 : -1;
            else ty += dy > 0 ? 1 : -1;

            if (tx >= 0 && tx < BOARD_SIZE && ty >= 0 && ty < BOARD_SIZE) {
              swapTiles(swipingTile, board[tx][ty], false); // 첫 번째 스와이프 (revert 아님)
            }
          }
          swipingTile = null;
        });

        // --- 4. 교환 로직 (무한 루프 방지 핵심) ---
        function swapTiles(tileA, tileB, isReverting = false) {
          if (!tileA || !tileB) return;
          isLocked = true;

          // 시각적 이동
          const posA = k.vec2(tileA.pos.x, tileA.pos.y);
          const posB = k.vec2(tileB.pos.x, tileB.pos.y);
          k.tween(
            tileA.pos,
            posB,
            0.2,
            (p) => (tileA.pos = p),
            k.easings.easeOutQuad,
          );
          k.tween(
            tileB.pos,
            posA,
            0.2,
            (p) => (tileB.pos = p),
            k.easings.easeOutQuad,
          );

          // 배열 위치 교환
          const ax = tileA.gridX,
            ay = tileA.gridY;
          const bx = tileB.gridX,
            by = tileB.gridY;

          tileA.gridX = bx;
          tileA.gridY = by;
          tileB.gridX = ax;
          tileB.gridY = ay;

          board[bx][by] = tileA;
          board[ax][ay] = tileB;

          // ★ 매칭 검사 여부 결정
          k.wait(0.25, () => {
            if (!isReverting) {
              // 매칭이 안 되면 되돌리라는 정보를 담아 보냄
              checkMatches({ tileA, tileB });
            } else {
              // 되돌리기 이동이 끝났으니 잠금 해제
              isLocked = false;
            }
          });
        }

        // --- 5. 매치 검사 ---
        function checkMatches(swapped = null) {
          if (gameEnded) return;
          let matched = new Set();

          // 가로 검사
          for (let y = 0; y < BOARD_SIZE; y++) {
            for (let x = 0; x < BOARD_SIZE - 2; x++) {
              let t1 = board[x][y],
                t2 = board[x + 1][y],
                t3 = board[x + 2][y];
              if (
                t1 &&
                t2 &&
                t3 &&
                t1.type === t2.type &&
                t1.type === board[x + 1][y].type &&
                t1.type === board[x + 2][y].type
              ) {
                matched.add(t1);
                matched.add(t2);
                matched.add(t3);
              }
            }
          }
          // 세로 검사
          for (let x = 0; x < BOARD_SIZE; x++) {
            for (let y = 0; y < BOARD_SIZE - 2; y++) {
              let t1 = board[x][y],
                t2 = board[x][y + 1],
                t3 = board[x][y + 2];
              if (
                t1 &&
                t2 &&
                t3 &&
                t1.type === t2.type &&
                t1.type === board[x][y + 1].type &&
                t1.type === board[x][y + 2].type
              ) {
                matched.add(t1);
                matched.add(t2);
                matched.add(t3);
              }
            }
          }

          if (matched.size > 0) {
            timeLeft = 60; // 시간 충전
            score += matched.size * 10;
            scoreLabel.text = `Score: ${score}`;
            matched.forEach((t) => {
              k.destroy(t);
              board[t.gridX][t.gridY] = null; // ★ 빈 공간 처리 확실히
            });
            k.wait(0.2, applyGravity);
          } else {
            // 매칭된 게 없는데 방금 스와이프를 한 거라면? 원래대로 되돌림 (revert flag ON)
            if (swapped) {
              swapTiles(swapped.tileA, swapped.tileB, true);
            } else {
              isLocked = false;
              if (!hasAnyMove()) forceValidMove();
            }
          }
        }

        // --- 6. 중력 및 리필 (빈칸 버그 해결) ---
        function applyGravity() {
          for (let x = 0; x < BOARD_SIZE; x++) {
            for (let y = BOARD_SIZE - 1; y >= 0; y--) {
              if (board[x][y] === null) {
                for (let ay = y - 1; ay >= 0; ay--) {
                  if (board[x][ay] !== null) {
                    let t = board[x][ay];
                    board[x][y] = t;
                    board[x][ay] = null;
                    t.gridY = y;
                    k.tween(
                      t.pos,
                      k.vec2(x * TILE_SIZE + offsetX, y * TILE_SIZE + offsetY),
                      0.2,
                      (p) => (t.pos = p),
                    );
                    break;
                  }
                }
              }
            }
          }
          k.wait(0.25, fillEmptySpaces);
        }

        function fillEmptySpaces() {
          let newTiles = [];
          for (let x = 0; x < BOARD_SIZE; x++) {
            for (let y = 0; y < BOARD_SIZE; y++) {
              if (board[x][y] === null) {
                const type = k.choose(TYPES);
                const t = k.add([
                  k.text(type, { size: CONTENT_SIZE }),
                  k.pos(x * TILE_SIZE + offsetX, -100), // 화면 밖 위에서 생성
                  k.anchor("center"),
                  k.area(),
                  "tile",
                  { gridX: x, gridY: y, type: type },
                ]);
                board[x][y] = t;
                newTiles.push(t);
              }
            }
          }

          // 내려올 때 검사
          if (newTiles.length > 0 && !hasAnyMove()) forceValidMove();

          newTiles.forEach((t) => {
            k.tween(
              t.pos,
              k.vec2(
                t.gridX * TILE_SIZE + offsetX,
                t.gridY * TILE_SIZE + offsetY,
              ),
              0.3,
              (p) => (t.pos = p),
            );
          });

          k.wait(0.35, () => {
            checkMatches(); // 연쇄 폭발 검사
          });
        }

        // --- 7. 보조 알고리즘 ---
        function hasAnyMove() {
          for (let x = 0; x < BOARD_SIZE; x++) {
            for (let y = 0; y < BOARD_SIZE; y++) {
              if (x < BOARD_SIZE - 1) {
                if (testSwap(x, y, x + 1, y)) return true;
              }
              if (y < BOARD_SIZE - 1) {
                if (testSwap(x, y, x, y + 1)) return true;
              }
            }
          }
          return false;
        }

        function testSwap(x1, y1, x2, y2) {
          if (!board[x1][y1] || !board[x2][y2]) return false;
          let t1 = board[x1][y1].type,
            t2 = board[x2][y2].type;
          board[x1][y1].type = t2;
          board[x2][y2].type = t1;
          let match = checkSingle(x1, y1) || checkSingle(x2, y2);
          board[x1][y1].type = t1;
          board[x2][y2].type = t2;
          return match;
        }

        function checkSingle(x, y) {
          let type = board[x][y].type;
          let h = 1,
            v = 1;
          for (
            let i = x - 1;
            i >= 0 && board[i][y] && board[i][y].type === type;
            i--
          )
            h++;
          for (
            let i = x + 1;
            i < BOARD_SIZE && board[i][y] && board[i][y].type === type;
            i++
          )
            h++;
          for (
            let j = y - 1;
            j >= 0 && board[x][j] && board[x][j].type === type;
            j--
          )
            v++;
          for (
            let j = y + 1;
            j < BOARD_SIZE && board[x][j] && board[x][j].type === type;
            j++
          )
            v++;
          return h >= 3 || v >= 3;
        }

        function forceValidMove() {
          let rx = k.randi(0, BOARD_SIZE - 2),
            ry = k.randi(0, BOARD_SIZE - 1),
            type = k.choose(TYPES);
          if (board[rx][ry]) {
            board[rx][ry].type = type;
            board[rx][ry].text = type;
          }
          if (board[rx + 1][ry]) {
            board[rx + 1][ry].type = type;
            board[rx + 1][ry].text = type;
          }
          if (board[rx + 2][ry + 1]) {
            board[rx + 2][ry + 1].type = type;
            board[rx + 2][ry + 1].text = type;
          }
        }

        fillEmptySpaces();
      });

      // --- [수정] 게임 오버 장면 (다시 선택 버튼 3개) ---
      k.scene("lose", (finalScore) => {
        k.background = [40, 40, 40];
        setBestScore(finalScore);

        k.add([
          k.text("GAME OVER", { size: 48 }),
          k.pos(k.center().x, 100),
          k.anchor("center"),
          k.color(255, 50, 50),
        ]);

        k.add([
          k.text(`Score: ${finalScore}\nBest: ${getBestScore()}`, { size: 24 }),
          k.pos(k.center().x, 180),
          k.anchor("center"),
          k.color(255, 255, 255),
        ]);

        function createRetryBtn(label, position, sceneName, btnColor) {
          const btn = k.add([
            k.rect(220, 60, { radius: 10 }),
            k.pos(position),
            k.anchor("center"),
            k.color(btnColor),
            k.area(),
          ]);
          k.add([
            k.text(label, { size: 18 }),
            k.pos(position),
            k.anchor("center"),
            k.color(255, 255, 255),
          ]);
          btn.onClick(() => k.go(sceneName));
        }

        const btnY = k.center().y + 60;
        createRetryBtn(
          "디노 다시하기",
          k.vec2(k.center().x, btnY),
          "dino",
          k.rgb(100, 160, 100),
        );
        createRetryBtn(
          "우주선 다시하기",
          k.vec2(k.center().x, btnY + 80),
          "shooter",
          k.rgb(100, 100, 180),
        );
        createRetryBtn(
          "퍼즐 다시하기",
          k.vec2(k.center().x, btnY + 160),
          "match3",
          k.rgb(180, 120, 80),
        );

        const mainBtn = k.add([
          k.text("Main Menu", { size: 16 }),
          k.pos(k.center().x, k.height() - 40),
          k.anchor("center"),
          k.area(),
        ]);
        mainBtn.onClick(() => k.go("lobby"));
      });

      // 처음 실행 시 로비로 이동
      k.go("lobby");
    </script>
  </body>
</html>
